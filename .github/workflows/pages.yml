name: Publish playable to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: retro-malaysia-production
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Branch publishing is still enabled in this repository. Let its raw
      # deployment finish first, then publish the tested production artifact.
      - name: Wait for branch publishing to finish
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 0; attempt < 30; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner, repo: context.repo.repo,
                head_sha: context.sha, per_page: 100
              });
              const branchRun = data.workflow_runs.find(run =>
                run.name === 'pages build and deployment' && run.event === 'dynamic');
              if (branchRun?.status === 'completed') {
                core.info('Branch publishing finished; production build will be published last.');
                return;
              }
              // Actions-only Pages sources do not create a branch deployment.
              if (!branchRun && attempt >= 3) return;
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error('Branch publishing is still running; retry this deployment when it finishes.');
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
