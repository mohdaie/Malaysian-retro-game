<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Retro Malaysia · Intro</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Scene 1's dialogue box is set in DejaVu Sans; the continuation matches it. */
      @font-face {
        font-family: "DejaVu Sans";
        src: url("assets/fonts/DejaVuSans.ttf") format("truetype");
        font-weight: 400;
      }
      @font-face {
        font-family: "DejaVu Sans";
        src: url("assets/fonts/DejaVuSans-Bold.ttf") format("truetype");
        font-weight: 700;
      }
      :root {
        --navy: #192537;
        --rim: #e8d4a2;
        --paper: #fdf1d7;
        --ink: #1f2a33;
        --gold: #fccf76;
        --chip-line: #1c304b;
        /* Phone-screen regions, in percent of each 1672×941 still. */
        --slide: polygon(28.469% 33.794%, 51.555% 27.418%, 57.895% 85.654%, 32.656% 93.092%);
        --kids: polygon(29.007% 34.219%, 50.658% 28.162%, 55.443% 67.481%, 31.699% 74.389%);
        --screen: polygon(27.512% 17.535%, 50.837% 12.752%, 58.911% 91.18%, 32.895% 99.362%);
        --pop: polygon(30.622% 46.546%, 51.914% 40.595%, 54.127% 69.075%, 32.775% 74.389%);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #07090c;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #07090c;
        font-family: "DejaVu Sans", sans-serif;
      }
      #scene1 {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 2;
      }
      #gallery {
        position: absolute;
        inset: 0;
        z-index: 1;
        overflow: hidden;
      }
      #s0 {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform-origin: 44% 66%;
      }
      #cam,
      #push,
      #sway {
        position: absolute;
        inset: 0;
      }
      #cam {
        opacity: 0;
        transform-origin: 838px 597px;
      }
      #push {
        transform-origin: 838px 597px;
      }
      #sway {
        transform-origin: 838px 900px;
      }
      /* Every still layer shares one box so the screen regions line up. */
      .layer,
      .layer img,
      .pane,
      .pane img,
      .pic {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1081px;
        display: block;
      }
      .pic {
        background-size: 100% 100%;
      }
      .hidden-start {
        opacity: 0;
      }
      .clip-screen {
        clip-path: var(--screen);
      }
      .clip-slide {
        clip-path: var(--slide);
      }
      .clip-pop {
        clip-path: var(--pop);
        transform-origin: 813px 625px;
      }
      .screen-white {
        background: #f8f3ea;
        clip-path: var(--slide);
      }
      .dim {
        background: rgba(10, 8, 6, 0.4);
        clip-path: var(--screen);
      }
      .touch {
        position: absolute;
        width: 84px;
        height: 84px;
        margin: -42px 0 0 -42px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.85) 0 34%, rgba(255, 255, 255, 0.35) 35% 62%, rgba(255, 255, 255, 0) 63%);
        box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.55);
        opacity: 0;
      }
      .touch-dot {
        position: absolute;
        width: 58px;
        height: 58px;
        margin: -29px 0 0 -29px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.55);
        box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.4), 0 0 24px rgba(255, 255, 255, 0.5);
        opacity: 0;
      }
      #bloom {
        position: absolute;
        left: 838px;
        top: 597px;
        width: 2800px;
        height: 2800px;
        margin: -1400px 0 0 -1400px;
        border-radius: 50%;
        background: radial-gradient(circle, #fffaf0 0 22%, rgba(255, 244, 214, 0.9) 38%, rgba(255, 230, 180, 0) 70%);
        opacity: 0;
      }
      #vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 75% 70% at 46% 52%, rgba(0, 0, 0, 0) 55%, rgba(12, 6, 2, 0.5) 100%);
        pointer-events: none;
      }
      #grain {
        position: absolute;
        inset: -60px;
        opacity: 0.11;
        mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 1.4 -0.2'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>");
        background-size: 240px 240px;
      }

      /* Dialogue box: Scene 1's design, one line tall so the photos stay in view. */
      #box {
        position: absolute;
        left: 135px;
        right: 135px;
        bottom: 24px;
        height: 170px;
        padding: 19px;
        border: 5px solid var(--rim);
        border-radius: 34px;
        background: var(--navy);
        box-shadow: 0 14px 40px rgba(10, 6, 2, 0.45);
        opacity: 0;
      }
      #box .paper {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 16px;
        background: var(--paper);
      }
      #box .chip {
        position: absolute;
        left: 70px;
        top: -33px;
        padding: 0 26px;
        height: 60px;
        display: flex;
        align-items: center;
        border: 4px solid var(--chip-line);
        border-radius: 12px;
        background: var(--gold);
        color: var(--navy);
        font-weight: 700;
        font-size: 24px;
        letter-spacing: 1.2px;
        z-index: 2;
      }
      #box .line {
        position: absolute;
        left: 50px;
        right: 120px;
        top: 50%;
        margin-top: -24px;
        height: 48px;
        color: var(--ink);
        font-size: 39px;
        line-height: 48px;
        letter-spacing: -0.3px;
        -webkit-text-stroke: 0.8px var(--ink);
        white-space: nowrap;
        opacity: 0;
      }
      #box .line span {
        opacity: 0;
      }
      #box .more {
        position: absolute;
        right: 34px;
        bottom: 14px;
        display: flex;
        gap: 9px;
      }
      #box .more i {
        display: block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #1f384e;
      }
      #flash {
        position: absolute;
        inset: 0;
        background: #fff7e6;
        opacity: 0;
      }
      #black {
        position: absolute;
        inset: 0;
        background: #000;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="54" data-width="1920" data-height="1080">
      <!-- Scene 1, as supplied. Its rain carries on in rain-bed below. -->
      <video
        id="scene1"
        class="clip"
        src="assets/video/scene-1.mp4"
        playsinline
        data-has-audio="true"
        data-start="0"
        data-duration="20"
        data-track-index="0"
      ></video>

      <!-- Scene 2: the gallery, from the last frame of Scene 1 to black. -->
      <div id="gallery" class="clip" data-start="19.9" data-duration="34.1" data-track-index="1">
        <img id="s0" src="assets/stills/00-scene-1-last-frame.webp" alt="" />

        <div id="cam">
          <div id="push">
            <div id="sway">
              <div id="s1" class="layer"><img src="assets/stills/01-album-cuti-sekolah.webp" alt="" /></div>
              <div id="s2" class="layer hidden-start"><img src="assets/stills/02-walkman-digimon.webp" alt="" /></div>
              <div id="s3" class="layer hidden-start"><img src="assets/stills/03-too-phat.webp" alt="" /></div>
              <div id="s4" class="layer hidden-start">
                <img src="assets/stills/04-klcc.webp" alt="" />
                <div id="dim" class="layer dim hidden-start"></div>
              </div>
              <div id="s5" class="layer hidden-start"><img src="assets/stills/05-notification.webp" alt="" /></div>

              <!-- Tap the album photo: the viewer grows out of it. -->
              <div id="open2" class="layer clip-screen hidden-start"><div class="pic" style="background-image: url('assets/stills/02-walkman-digimon.webp')"></div></div>

              <!-- Swipes: each pane carries its own photo region and slides inside the screen. -->
              <div id="sw23" class="layer hidden-start">
                <div class="layer screen-white"></div>
                <div class="layer clip-slide">
                  <div id="sw23-out" class="pane clip-slide"><div class="pic" style="background-image: url('assets/stills/02-walkman-digimon.webp')"></div></div>
                  <div id="sw23-in" class="pane clip-slide"><div class="pic" style="background-image: url('assets/stills/03-too-phat.webp')"></div></div>
                </div>
              </div>
              <div id="sw34" class="layer hidden-start">
                <div class="layer screen-white"></div>
                <div class="layer clip-slide">
                  <div id="sw34-out" class="pane clip-slide"><div class="pic" style="background-image: url('assets/stills/03-too-phat.webp')"></div></div>
                  <div id="sw34-in" class="pane clip-slide"><div class="pic" style="background-image: url('assets/stills/04-klcc.webp')"></div></div>
                </div>
              </div>

              <!-- Notification pops over the KLCC photo. -->
              <div id="pop" class="layer clip-pop hidden-start"><div class="pic" style="background-image: url('assets/stills/05-notification.webp')"></div></div>

              <div id="tap-open" class="touch" style="left: 804px; top: 551px"></div>
              <div id="swipe-a" class="touch-dot" style="left: 1011px; top: 643px"></div>
              <div id="swipe-b" class="touch-dot" style="left: 1011px; top: 643px"></div>
              <div id="hold-klik" class="touch-dot" style="left: 829px; top: 698px"></div>
              <div id="tap-klik" class="touch" style="left: 829px; top: 698px"></div>
              <div id="bloom"></div>
            </div>
          </div>
        </div>

        <div id="vignette"></div>
        <div id="grain"></div>

        <div id="box">
          <div class="chip">2026 · PROLOG</div>
          <div class="paper">
            <div class="line" id="l1">Bestnya... rindu zaman budak-budak dulu.</div>
            <div class="line" id="l2">Boleh main gasing, bola petang-petang.</div>
            <div class="line" id="l3">Fuh, legend gila Walkman dengan Digimon dulu-dulu nih.</div>
            <div class="line" id="l4">Peh, album Too Phat... gila kenangan time ni.</div>
            <div class="line" id="l5">Time-time remaja, memang selalu pegi KLCC ni lepak.</div>
            <div class="line" id="l6">Fuh... kenangan..</div>
            <div class="line" id="l7">...</div>
            <div class="more"><i></i><i></i><i></i></div>
          </div>
        </div>

        <div id="flash"></div>
        <div id="black"></div>
      </div>

      <!-- Sound: Scene 1's rain continues, the game's theme comes in as the memories do. -->
      <audio
        id="rain-bed"
        src="assets/audio/rain-bed.m4a"
        data-start="19.4"
        data-duration="33"
        data-track-index="2"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0},{"t":0.6,"v":1},{"t":28.6,"v":1},{"t":30,"v":1.25},{"t":32.3,"v":1.25},{"t":32.45,"v":0}]}]}'
      ></audio>
      <audio
        id="theme"
        src="assets/audio/sore-kampung-intro.m4a"
        data-start="20.6"
        data-duration="31.2"
        data-track-index="3"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0},{"t":3.5,"v":0.3},{"t":24,"v":0.3},{"t":26,"v":0.42},{"t":27.2,"v":0.42},{"t":28.4,"v":0.07},{"t":30.6,"v":0.07},{"t":31.1,"v":0}]}]}'
      ></audio>
      <audio id="sfx-raise" src="assets/audio/sfx-raise.wav" data-start="19.95" data-duration="0.9" data-track-index="4" data-volume="0.8"></audio>
      <audio id="sfx-tap-open" src="assets/audio/sfx-tap.wav" data-start="29.3" data-duration="0.12" data-track-index="5" data-volume="0.55"></audio>
      <audio id="sfx-open" src="assets/audio/sfx-swipe.wav" data-start="29.38" data-duration="0.45" data-track-index="4" data-volume="0.5"></audio>
      <audio id="sfx-swipe-a" src="assets/audio/sfx-swipe.wav" data-start="34.95" data-duration="0.45" data-track-index="4" data-volume="0.8"></audio>
      <audio id="sfx-swipe-b" src="assets/audio/sfx-swipe.wav" data-start="39.95" data-duration="0.45" data-track-index="4" data-volume="0.8"></audio>
      <audio id="sfx-notify" src="assets/audio/sfx-notify.wav" data-start="48" data-duration="1.49" data-track-index="5" data-volume="0.8"></audio>
      <audio id="sfx-tap-klik" src="assets/audio/sfx-tap.wav" data-start="51.2" data-duration="0.12" data-track-index="5" data-volume="0.7"></audio>
      <audio id="sfx-pull" src="assets/audio/sfx-pull.wav" data-start="51.2" data-duration="0.55" data-track-index="6" data-volume="0.75"></audio>
      <audio id="sfx-clunk" src="assets/audio/sfx-clunk.wav" data-start="52.6" data-duration="0.4" data-track-index="6" data-volume="0.7"></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Split each line into characters for the typewriter.
      document.querySelectorAll("#box .line").forEach((line) => {
        const text = line.textContent;
        line.textContent = "";
        for (const ch of text) {
          const span = document.createElement("span");
          span.textContent = ch;
          line.appendChild(span);
        }
      });

      const type = (id, at, perChar = 0.034) => {
        tl.set(id, { opacity: 1 }, at);
        tl.to(`${id} span`, { opacity: 1, duration: 0.01, stagger: perChar, ease: "none" }, at);
      };
      const clear = (id, at) => tl.to(id, { opacity: 0, duration: 0.22, ease: "power1.in" }, at);
      const showBox = (at) => tl.fromTo("#box", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, at);
      const hideBox = (at) => tl.to("#box", { opacity: 0, y: 18, duration: 0.35, ease: "power2.in" }, at);
      const tap = (id, at) => {
        tl.fromTo(id, { opacity: 0.95, scale: 0.45 }, { opacity: 0, scale: 1.55, duration: 0.5, ease: "power2.out", immediateRender: false }, at);
      };
      // One swipe: finger drags left along the tilted screen, photos follow.
      const swipe = (prefix, dot, nextBase, at) => {
        tl.set(`#${prefix}`, { opacity: 1 }, at);
        tl.fromTo(dot, { opacity: 0, x: 0, y: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.12 }, at - 0.08);
        tl.to(dot, { x: -345, y: 53, duration: 0.42, ease: "power2.inOut" }, at);
        tl.to(dot, { opacity: 0, duration: 0.15 }, at + 0.34);
        tl.fromTo(`#${prefix}-out`, { x: 0, y: 0 }, { x: -477, y: 73, duration: 0.55, ease: "power3.inOut" }, at);
        tl.fromTo(`#${prefix}-in`, { x: 477, y: -73 }, { x: 0, y: 0, duration: 0.55, ease: "power3.inOut" }, at);
        tl.set(nextBase, { opacity: 1 }, at + 0.56);
        tl.set(`#${prefix}`, { opacity: 0 }, at + 0.58);
      };

      // ── 20.0 · Lift the phone: Scene 1's last frame gives way to the album.
      tl.to("#s0", { scale: 1.12, y: -30, filter: "blur(10px)", duration: 1.1, ease: "power2.in" }, 20);
      tl.to("#s0", { opacity: 0, duration: 0.6, ease: "none" }, 20.5);
      tl.fromTo("#cam", { opacity: 0, scale: 0.93, y: 70, filter: "blur(10px)" }, { opacity: 1, scale: 1, y: 0, filter: "blur(0px)", duration: 1.2, ease: "power3.out" }, 20.35);

      // Handheld breathing across the whole gallery.
      tl.to("#sway", { x: 6, duration: 3.7, ease: "sine.inOut", yoyo: true, repeat: 8 }, 20.3);
      tl.to("#sway", { y: -8, duration: 5.3, ease: "sine.inOut", yoyo: true, repeat: 5 }, 20.3);
      tl.to("#sway", { rotation: 0.45, duration: 6.1, ease: "sine.inOut", yoyo: true, repeat: 4 }, 20.3);

      // Slow push toward the phone while the memories play.
      tl.fromTo("#push", { scale: 1 }, { scale: 1.05, duration: 8, ease: "sine.inOut" }, 21.2);
      tl.to("#push", { scale: 1.075, duration: 18, ease: "sine.inOut" }, 29.4);
      tl.to("#push", { scale: 1.13, duration: 3.2, ease: "power1.inOut" }, 48);
      tl.to("#push", { scale: 1.2, duration: 0.55, ease: "power3.in" }, 51.2);

      // Film grain shimmer (stepped, deterministic).
      tl.fromTo("#grain", { backgroundPosition: "0px 0px" }, { backgroundPosition: "240px 160px", duration: 34, ease: "steps(400)" }, 20);

      // ── 21.8 · Album: Cuti Sekolah 2000.
      showBox(21.7);
      type("#l1", 22.0);
      clear("#l1", 25.2);
      type("#l2", 25.6);
      clear("#l2", 29.0);

      // ── 29.3 · Tap the photo, the viewer opens on the Walkman and Digimon.
      tap("#tap-open", 29.3);
      tl.fromTo("#open2", { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "none" }, 29.4);
      tl.fromTo(
        "#open2",
        { clipPath: "polygon(29.007% 34.219%, 50.658% 28.162%, 55.443% 67.481%, 31.699% 74.389%)" },
        { clipPath: "polygon(27.512% 17.535%, 50.837% 12.752%, 58.911% 91.18%, 32.895% 99.362%)", duration: 0.6, ease: "power3.inOut", immediateRender: false },
        29.4,
      );
      tl.to("#s2", { opacity: 1, duration: 0.25, ease: "none" }, 29.95);
      tl.set("#open2", { opacity: 0 }, 30.25);
      type("#l3", 30.3);
      clear("#l3", 34.6);

      // ── 35.0 · Swipe: Too Phat.
      swipe("sw23", "#swipe-a", "#s3", 34.95);
      type("#l4", 35.8);
      clear("#l4", 39.6);

      // ── 40.0 · Swipe: KLCC.
      swipe("sw34", "#swipe-b", "#s4", 39.95);
      type("#l5", 40.8);
      clear("#l5", 44.4);
      type("#l6", 44.8, 0.09);
      hideBox(47.5);

      // ── 48.0 · "Nak balik zaman 2000?"
      tl.to("#dim", { opacity: 1, duration: 0.3, ease: "power1.out" }, 48);
      tl.fromTo("#pop", { opacity: 0, scale: 0.84 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.8)" }, 48);
      tl.to("#s5", { opacity: 1, duration: 0.35, ease: "none" }, 48.5);
      tl.set("#pop", { opacity: 0 }, 48.9);

      // ── 49.2 · Thinking...
      tl.set("#box .line", { opacity: 0 }, 49.1);
      showBox(49.2);
      type("#l7", 49.45, 0.5);

      // ── 51.2 · Tap "Klik sini", the screen swallows the room, black.
      tl.fromTo("#hold-klik", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.18, ease: "power2.out" }, 51.0);
      tl.to("#hold-klik", { opacity: 0, duration: 0.2 }, 51.3);
      tap("#tap-klik", 51.2);
      tl.to("#s5", { scale: 0.985, duration: 0.08, ease: "power2.out", transformOrigin: "829px 698px" }, 51.2);
      tl.to("#s5", { scale: 1, duration: 0.12, ease: "power2.out" }, 51.28);
      hideBox(51.25);
      tl.fromTo("#bloom", { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power1.out" }, 51.25);
      tl.fromTo("#bloom", { scale: 0.12 }, { scale: 1.3, duration: 0.5, ease: "power2.in", immediateRender: false }, 51.25);
      tl.to("#flash", { opacity: 0.9, duration: 0.22, ease: "power2.in" }, 51.53);
      tl.set("#black", { opacity: 1 }, 51.75);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
